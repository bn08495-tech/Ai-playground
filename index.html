<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindVault — AI Knowledge Notebook</title>
<style>
:root{--bg:#0b0d10;--panel:#11151a;--panel2:#171c22;--line:#28303a;--text:#f3f5f7;--muted:#9aa5b1;--accent:#dce6f2;--danger:#ff7d7d;--good:#7ee2ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#1b222b 0,#0b0d10 42%);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}button,input,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{border-color:#536171}.app{display:grid;grid-template-columns:250px 1fr;height:100vh}.side{border-right:1px solid var(--line);background:#0d1014;padding:18px 12px;overflow:auto}.brand{font-weight:800;font-size:20px;padding:4px 10px 20px}.brand span{color:var(--muted);font-weight:500;font-size:11px;display:block;margin-top:4px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;color:var(--muted)}.nav button.active,.nav button:hover{background:#181e25;color:var(--text)}.section{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#66717d;margin:18px 10px 7px}.main{display:grid;grid-template-rows:64px 1fr;min-width:0}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 20px}.search{flex:1;background:#101419;border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}.content{overflow:auto;padding:24px;max-width:1300px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{margin:0 0 6px;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(145deg,#14191f,#101419);border:1px solid var(--line);border-radius:16px;padding:17px}.metric{font-size:27px;font-weight:800;margin-top:8px}.cards{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.panel h2{font-size:15px;margin:0 0 14px}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid #222a33;border-radius:11px;background:#101419}.editor{display:grid;grid-template-columns:280px 1fr;gap:14px;height:calc(100vh - 112px)}.files{overflow:auto}.file{width:100%;text-align:left;margin-bottom:5px}.file.active{border-color:#738294;background:#202832}.editbox{display:grid;grid-template-rows:auto 1fr;min-width:0}.toolbar{display:flex;gap:7px;align-items:center;margin-bottom:10px}.title{flex:1;font-size:18px;font-weight:700;background:transparent;border:0;outline:0}.textarea{width:100%;height:100%;resize:none;background:#0e1216;border:1px solid var(--line);border-radius:14px;padding:18px;line-height:1.65;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.teach{max-width:760px;margin:auto}.teach textarea{width:100%;min-height:220px}.row{display:flex;gap:8px;align-items:center}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:850px){.app{grid-template-columns:70px 1fr}.brand span,.nav button span,.section{display:none}.brand{text-align:center}.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.editor{grid-template-columns:1fr}.files{display:none}.content{padding:15px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">🧠 MindVault<span>AI knowledge notebook</span></div><div class="nav"><button data-page="dashboard" class="active">🏠 <span>Dashboard</span></button><button data-page="teach">✨ <span>Teach AI</span></button><button data-page="notebook">📓 <span>Notebook</span></button></div><div class="section">Knowledge</div><div class="nav" id="knowledgeNav"></div><div class="section">System</div><div class="nav"><button data-page="history">📖 <span>Learning history</span></button><button data-page="settings">⚙️ <span>Settings</span></button></div></aside><main class="main"><header class="top"><input id="search" class="search" placeholder="Search your knowledge…"><button id="exportBtn">Export</button><button id="importBtn">Import</button><input id="importFile" type="file" accept=".md,.zip" hidden></header><section id="view" class="content"></section></main></div>
<script>
const categories=[['knowledge','📚','Knowledge'],['skills','🛠️','Skills'],['discoveries','🔬','Discoveries'],['user','👤','About User'],['instructions','📋','Instructions'],['preferences','❤️','Preferences'],['projects','🚀','Projects'],['ideas','💡','Ideas'],['corrections','❌','Mistakes & Corrections']];
const seed={knowledge:'# Knowledge\n\nYour confirmed, reusable facts and concepts.\n\n## Getting started\nWrite knowledge here or use Teach AI.\n',skills:'# Skills\n\nSkills demonstrated or confirmed by the user.\n',discoveries:'# Discoveries\n\nUnverified observations and new findings.\n',user:'# About User\n\nStable information the user explicitly chooses to store.\n',instructions:'# Instructions\n\nRules the AI should follow.\n',preferences:'# Preferences\n\nHow the user prefers the system to behave.\n',projects:'# Projects\n\nActive and completed projects.\n',ideas:'# Ideas\n\nFuture ideas and possibilities.\n',corrections:'# Mistakes & Corrections\n\nCorrections to previously stored information.\n',history:'# Learning History\n\n## 2026-08-27\n- Notebook initialized.\n'};
let db=JSON.parse(localStorage.getItem('mindvault')||'null')||seed; let current='knowledge';
function save(){localStorage.setItem('mindvault',JSON.stringify(db))}
function nav(){document.getElementById('knowledgeNav').innerHTML=categories.map(([id,ic,n])=>`<button data-page="${id}">${ic} <span>${n}</span></button>`).join('');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>openPage(b.dataset.page))}
function openPage(page){current=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='dashboard')dashboard();else if(page==='teach')teach();else if(page==='notebook')notebook();else if(page==='history')editor('history');else if(page==='settings')settings();else editor(page)}
function dashboard(){let counts=Object.fromEntries(categories.map(([id])=>[id,(db[id]||'').split('\n').filter(x=>x.trim()&&!x.startsWith('#')).length]));view.innerHTML=`<div class="hero"><div><h1>Your AI Brain</h1><div class="muted">A human-readable knowledge vault that grows with you.</div></div><div class="row"><button onclick="openPage('teach')">✨ Teach AI</button><button onclick="openPage('notebook')">📓 Open notebook</button></div></div><div class="grid">${categories.slice(0,4).map(([id,ic,n])=>`<div class="card"><div>${ic} ${n}</div><div class="metric">${counts[id]}</div><div class="muted">entries</div></div>`).join('')}</div><div class="cards"><div class="panel"><h2>Recently learned</h2><div class="list">${recent()}</div></div><div class="panel"><h2>Knowledge architecture</h2><div class="list"><div class="item">🧠 Markdown is the source of truth</div><div class="item">🔍 Search spans every notebook</div><div class="item">🛡️ Changes stay local until exported</div><div class="item">🔄 AI changes can be reviewed before saving</div></div></div></div>`}
function recent(){let h=(db.history||'').split('\n').filter(x=>x.trim()&&x.startsWith('-')).slice(-5).reverse();return h.length?h.map(x=>`<div class="item">${x.replace('- ','')}</div>`).join(''):'<div class="empty">No learning events yet.</div>'}
function editor(id){let name=categories.find(x=>x[0]===id)?.[2]||'Learning History';view.innerHTML=`<div class="editor"><div class="files"><div class="muted" style="margin:5px 8px 12px">NOTEBOOK</div>${categories.map(([i,ic,n])=>`<button class="file ${i===id?'active':''}" onclick="editor('${i}')">${ic} ${n}</button>`).join('')}<button class="file ${id==='history'?'active':''}" onclick="editor('history')">📖 Learning History</button></div><div class="editbox"><div class="toolbar"><input id="docTitle" class="title" value="${name}"><button onclick="saveEditor('${id}')">Save</button><button onclick="downloadMd('${id}')">Download .md</button></div><textarea id="md" class="textarea">${esc(db[id]||'')}</textarea></div></div>`}
function saveEditor(id){db[id]=document.getElementById('md').value;save();addHistory('Edited '+id);toast('Saved to notebook');}
function teach(){view.innerHTML=`<div class="teach"><div class="hero"><div><h1>✨ Teach AI</h1><div class="muted">Write naturally. MindVault suggests where the information belongs.</div></div></div><div class="panel"><textarea id="lesson" class="textarea" placeholder="Example: Always give complete Arduino wiring tables before code.\n\nOr: I discovered my current sensor reads 1023 even when there is no gas."></textarea><div class="toolbar" style="margin-top:12px"><select id="kind" style="background:#101419;border:1px solid var(--line);padding:10px;border-radius:10px"><option value="auto">Auto classify</option>${categories.map(x=>`<option value="${x[0]}">${x[2]}</option>`).join('')}</select><button onclick="analyzeLesson()">Analyze & Learn</button></div><div id="proposal"></div></div></div>`}
function analyzeLesson(){let text=document.getElementById('lesson').value.trim();if(!text)return;let forced=document.getElementById('kind').value;let type=forced==='auto'?classify(text):forced;let name=categories.find(x=>x[0]===type)?.[2]||type;proposal.innerHTML=`<div class="item" style="margin-top:12px"><div class="row"><span class="pill">${name}</span><span class="pill">proposed change</span></div><p>${esc(text)}</p><button onclick="acceptLesson(${JSON.stringify(type)},${JSON.stringify(text)})">Accept & save</button> <button onclick="document.getElementById('proposal').innerHTML=''">Reject</button></div>`}
function classify(t){let x=t.toLowerCase();if(/prefer|like|style|always|never|should/.test(x))return /always|never|should/.test(x)?'instructions':'preferences';if(/discover|found|noticed|observed|unexpected/.test(x))return'discoveries';if(/skill|can do|learned how|know how/.test(x))return'skills';if(/project|build|app|rover|website/.test(x))return'projects';if(/idea|could|future/.test(x))return'ideas';if(/correct|wrong|mistake|instead/.test(x))return'corrections';return'knowledge'}
function acceptLesson(type,text){db[type]=(db[type]||'')+'\n\n## '+new Date().toLocaleDateString()+'\n'+text+'\n';save();addHistory('Learned new '+type+' entry');toast('Added to '+(categories.find(x=>x[0]===type)?.[2]||type));document.getElementById('lesson').value='';document.getElementById('proposal').innerHTML='<div class="item" style="margin-top:12px;color:var(--good)">✓ Saved to your Markdown notebook.</div>'}
function addHistory(s){db.history=(db.history||'# Learning History\n')+'\n- '+new Date().toLocaleString()+': '+s;save()}
function notebook(){view.innerHTML=`<div class="hero"><div><h1>📓 Notebook</h1><div class="muted">All knowledge areas in one place.</div></div></div><div class="grid">${categories.map(([id,ic,n])=>`<div class="card" onclick="editor('${id}')" style="cursor:pointer"><div>${ic} ${n}</div><div class="muted" style="margin-top:9px">${(db[id]||'').length.toLocaleString()} characters</div></div>`).join('')}</div>`}
function settings(){view.innerHTML=`<div class="teach"><h1>⚙️ Settings</h1><div class="panel"><h2>AI provider</h2><p class="muted">The notebook works without an AI provider. For real AI editing, connect an OpenAI-compatible or local endpoint in your own backend rather than exposing API keys in the browser.</p><div class="item">Recommended: local Ollama endpoint through a small local server. Cloud providers can be added through a secure backend proxy.</div><h2 style="margin-top:20px">Storage</h2><p class="muted">Current MVP storage: browser localStorage. Export your Markdown regularly to keep a portable backup.</p><button onclick="if(confirm('Reset the notebook to its starter content?')){db=JSON.parse(JSON.stringify(seed));save();openPage('dashboard')}">Reset notebook</button></div></div>`}
function search(q){q=q.toLowerCase().trim();if(!q){openPage(current);return}let hits=[];categories.concat([['history','📖','Learning History']]).forEach(([id,,n])=>{(db[id]||'').split(/\n\n+/).forEach(block=>{if(block.toLowerCase().includes(q))hits.push({n,id,block})})});view.innerHTML=`<div class="hero"><div><h1>Search</h1><div class="muted">${hits.length} result(s)</div></div></div><div class="list">${hits.map(h=>`<div class="item" onclick="editor('${h.id}')"><span class="pill">${h.n}</span><p>${esc(h.block.slice(0,500))}</p></div>`).join('')||'<div class="empty">Nothing found.</div>'}</div>`}
function downloadMd(id){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([db[id]||''],{type:'text/markdown'}));a.download=id+'.md';a.click();URL.revokeObjectURL(a.href)}
function exportAll(){let text='# MindVault Export\n\n';categories.concat([['history','📖','Learning History']]).forEach(([id,,n])=>text+='\n---\n\n# '+n+'\n\n'+(db[id]||'')+'\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download='mindvault-export.md';a.click()}
function esc(s){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;bottom:20px;right:20px;background:#e9eef4;color:#111;padding:11px 15px;border-radius:10px;z-index:5';document.body.append(x);setTimeout(()=>x.remove(),1800)}
nav();openPage('dashboard');document.getElementById('search').oninput=e=>search(e.target.value);document.getElementById('exportBtn').onclick=exportAll;document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db.knowledge=r.result;save();openPage('knowledge');toast('Imported Markdown into Knowledge')};r.readAsText(f)};
</script></body></html>
